services:
  - type: web
    name: opsforge
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MONGODB_ATLAS_URI
        sync: false
      - key: RAILWAY_API_TOKEN
        sync: false
      - key: RAILWAY_PROJECT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
